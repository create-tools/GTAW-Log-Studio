<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="purple2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg2)" stroke="#292524" stroke-width="6"/>
  <rect x="26" y="26" width="460" height="460" rx="110" fill="none" stroke="#9333ea" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Chat Chevrons & Log Prompt Mark -->
  <g transform="translate(256, 256)">
    <!-- Primary Bubble Silhouette -->
    <path d="M -110 -80 C -110 -115 -80 -130 -30 -130 L 70 -130 C 120 -130 140 -110 140 -60 L 140 20 C 140 70 110 90 60 90 L -40 90 L -100 130 L -90 85 C -105 75 -110 50 -110 20 Z" fill="none" stroke="url(#purple2)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner Clean Log Lines (White) -->
    <rect x="-60" y="-70" width="140" height="18" rx="9" fill="#ffffff"/>
    <rect x="-60" y="-30" width="110" height="18" rx="9" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="-60" y="10" width="75" height="18" rx="9" fill="#a855f7"/>
