<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6" filter="url(#subtleShadow)"/>
  <rect x="27" y="27" width="458" height="458" rx="109" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Geometric G Monogram -->
  <g transform="translate(256, 256)">
    <!-- Outer G Arc (White) -->
    <path d="M 60 -120 A 130 130 0 1 0 130 0 L 130 20 L 0 20 L 0 -20 L 90 -20 A 90 90 0 1 1 42 -82 Z" fill="#ffffff" />
    
    <!-- Inner Purple Accent Arrow / Wave -->
    <path d="M -30 -60 L 40 0 L -30 60 L -60 35 L -15 0 L -60 -35 Z" fill="url(#purpleGrad)"/>

    <!-- Terminal Dot (Cyan/Purple) -->
    <circle cx="50" cy="70" r="16" fill="url(#accentGrad)" />
  </g>
</svg>
